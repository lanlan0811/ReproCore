name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm pack:cli
      - run: pnpm release:metadata
      - run: pnpm smoke:install
      - name: Read candidate version
        if: runner.os == 'Linux'
        id: candidate
        shell: bash
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload external-trial candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: reprocore-${{ steps.candidate.outputs.version }}-candidate-${{ github.sha }}
          path: |
            release/reprocore-*.tgz
            release/reprocore-*.cdx.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  node-22-compatibility:
    name: Node 22.13 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
