name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate tag and package version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p \"require('./packages/cli/package.json').version\")"
      - run: pnpm verify
      - run: pnpm build
